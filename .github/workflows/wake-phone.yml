name: Signal phone for Douyin fire

on:
  schedule:
    # Beijing 13:10; delayed delivery allowed before 22:00 the same day.
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "TEST: unlock only. FRIEND1: armed test to 阿欣. DAILY: send today, 13:10-22:00 Beijing; skips sent friends."
        required: true
        default: TEST
        type: choice
        options:
          - TEST
          - FRIEND1
          - DAILY

permissions:
  contents: read

concurrency:
  group: phone-wake
  cancel-in-progress: false

jobs:
  signal:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_PHONE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      PHONE_WAKE_HMAC_KEY: ${{ secrets.PHONE_WAKE_HMAC_KEY }}
      MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'DAILY') && 'WAKE' || inputs.mode }}
    steps:
      - name: Send compact signed signal (delivery is not unlock confirmation)
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, hmac, json, os, time, urllib.request
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=8)))
          mode = os.environ['MODE']
          if mode not in ('TEST', 'FRIEND1', 'WAKE'):
              raise SystemExit('Unsupported mode')
          key = os.environ['PHONE_WAKE_HMAC_KEY']
          webhook = os.environ['WEBHOOK_URL']
          if not key or not webhook:
              raise SystemExit('Missing phone key or webhook')
          
          def send_text(text):
              body = {'msg_type': 'text', 'content': {'text': text}}
              secret = os.environ.get('FEISHU_SECRET', '')
              if secret:
                  timestamp = str(int(time.time()))
                  sign = base64.b64encode(hmac.new((timestamp + '\n' + secret).encode(), b'', hashlib.sha256).digest()).decode()
                  body.update(timestamp=timestamp, sign=sign)
              request = urllib.request.Request(webhook, data=json.dumps(body).encode(), headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.load(response)
              except Exception:
                  raise SystemExit('Feishu request failed; webhook details omitted') from None
              code = result.get('code', result.get('StatusCode', -1))
              if str(code) != '0':
                  raise SystemExit('Feishu rejected notification, code=' + str(code))
          
          minutes = now.hour * 60 + now.minute
          if mode == 'WAKE' and not (790 <= minutes < 1320):
              send_text('抖音续火花：' + now.strftime('%Y-%m-%d %H:%M') + ' 定时任务到达时已超出当天 13:10–22:00 发送时段，已跳过发送。')
              raise SystemExit('Outside daily delivery window; Feishu skip notification accepted')
          stamp = now.strftime('%Y%m%d:') + ('1310' if mode == 'WAKE' else now.strftime('%H%M'))
          digest = hmac.new(key.encode(), (mode + ':' + stamp).encode(), hashlib.sha256).digest()[:12]
          token = base64.urlsafe_b64encode(digest).decode().rstrip('=')
          text = '抖音续火花：' + {'TEST': 'T', 'FRIEND1': 'A', 'WAKE': 'D'}[mode] + token
          send_text(text)
          print('Feishu accepted compact signal. Phone receipt and unlock still require verification.')
          PY
